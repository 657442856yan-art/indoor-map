<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高德室内地图展示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }

    #container { width: 100vw; height: 100vh; }

    /* 顶部标题栏 */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(10, 30, 80, 0.88);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 999;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }
    #header .logo {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }
    #header .logo span { color: #00d4ff; }
    #header .subtitle {
      margin-left: 16px;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      border-left: 1px solid rgba(255,255,255,0.2);
      padding-left: 16px;
    }

    /* 左侧信息面板 */
    #panel {
      position: fixed;
      top: 76px; left: 20px;
      width: 260px;
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.12);
      z-index: 999;
      backdrop-filter: blur(10px);
    }
    #panel h3 {
      font-size: 15px;
      color: #1a1a2e;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #panel .divider { border: none; border-top: 1px solid #eee; margin: 10px 0; }
    .info-row { margin: 8px 0; }
    .info-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
    .info-value { font-size: 14px; color: #222; font-weight: 600; margin-top: 2px; }

    /* 楼层切换器 */
    #floor-panel {
      position: fixed;
      top: 50%;
      right: 24px;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.95);
      border-radius: 14px;
      padding: 10px 8px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.14);
      z-index: 999;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    #floor-panel .floor-title {
      font-size: 10px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .floor-btn {
      width: 44px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #555;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .floor-btn:hover { background: #f0f4ff; color: #3b82f6; }
    .floor-btn.active {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      box-shadow: 0 3px 10px rgba(59,130,246,0.4);
    }

    /* POI搜索 */
    #search-box {
      position: fixed;
      top: 76px; left: 300px;
      z-index: 999;
    }
    #search-box input {
      width: 280px;
      height: 42px;
      border: none;
      border-radius: 21px;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      padding: 0 20px 0 44px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      color: #333;
      transition: box-shadow 0.2s;
      backdrop-filter: blur(10px);
    }
    #search-box input:focus { box-shadow: 0 4px 24px rgba(59,130,246,0.25); }
    #search-box .search-icon {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      opacity: 0.5;
    }
    #search-results {
      position: absolute;
      top: 48px; left: 0;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    #search-results.show { display: block; }
    .search-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f5f5f5;
      font-size: 13px;
      color: #333;
      transition: background 0.15s;
    }
    .search-item:hover { background: #f0f4ff; }
    .search-item .s-name { font-weight: 600; }
    .search-item .s-addr { font-size: 11px; color: #999; margin-top: 2px; }

    /* 地图提示 */
    #tip {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      color: #fff;
      border-radius: 24px;
      padding: 10px 24px;
      font-size: 13px;
      z-index: 999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      backdrop-filter: blur(8px);
    }
    #tip.show { opacity: 1; }

    /* 加载遮罩 */
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a1e50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      transition: opacity 0.6s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .loader-ring {
      width: 56px; height: 56px;
      border: 3px solid rgba(0,212,255,0.2);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { color: rgba(255,255,255,0.7); font-size: 14px; letter-spacing: 1px; }

    /* 图例 */
    #legend {
      position: fixed;
      bottom: 30px; left: 20px;
      background: rgba(255,255,255,0.92);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      color: #555;
      z-index: 999;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      backdrop-filter: blur(8px);
    }
    #legend h4 { font-size: 12px; color: #333; margin-bottom: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    /* 路线按钮 */
    #route-btn {
      position: fixed;
      bottom: 30px; right: 24px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 4px 20px rgba(59,130,246,0.4);
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #route-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(59,130,246,0.5);
    }

    /* 室内地图控件样式 */
    .amap-indoor-floor-bar {
      z-index: 998 !important;
    }
  </style>
</head>
<body>

<!-- 加载遮罩 -->
<div id="loading">
  <div class="loader-ring"></div>
  <div class="loader-text">正在加载室内地图…</div>
</div>

<!-- 地图容器 -->
<div id="container"></div>

<!-- 顶部标题 -->
<div id="header">
  <div class="logo">🗺️ <span>室内地图</span></div>
  <div class="subtitle">高德 JS API 2.0 · 楼层导览</div>
</div>

<!-- 左侧信息面板 -->
<div id="panel">
  <h3>🏢 当前位置</h3>
  <div class="divider"></div>
  <div class="info-row">
    <div class="info-label">建筑物名称</div>
    <div class="info-value" id="building-name">北京国贸中心</div>
  </div>
  <div class="info-row">
    <div class="info-label">当前楼层</div>
    <div class="info-value" id="current-floor">—</div>
  </div>
  <div class="info-row">
    <div class="info-label">楼层数量</div>
    <div class="info-value" id="floor-count">—</div>
  </div>
  <div class="info-row">
    <div class="info-label">中心坐标</div>
    <div class="info-value" id="center-coord" style="font-size:12px">—</div>
  </div>
  <div class="divider"></div>
  <div style="font-size:11px;color:#aaa;line-height:1.5">
    💡 点击地图标记可查看商铺信息<br>
    🔍 右侧切换楼层进行浏览
  </div>
</div>

<!-- 搜索框 -->
<div id="search-box" style="position:fixed;top:76px;left:300px;z-index:999">
  <span class="search-icon">🔍</span>
  <input type="text" id="poi-input" placeholder="搜索楼层内商铺或设施…" autocomplete="off">
  <div id="search-results"></div>
</div>

<!-- 右侧楼层切换器 -->
<div id="floor-panel">
  <div class="floor-title">FLOOR</div>
  <!-- 动态生成楼层按钮 -->
</div>

<!-- 图例 -->
<div id="legend">
  <h4>📌 图例</h4>
  <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div> 入口</div>
  <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div> 电梯</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> 扶梯</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> 卫生间</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div> 商铺</div>
</div>

<!-- 路线规划按钮 -->
<button id="route-btn" onclick="showRouteTip()">🧭 楼层内导航</button>

<!-- 提示 -->
<div id="tip"></div>

<!-- 高德地图 JS API 2.0 -->
<script src="https://webapi.amap.com/maps?v=2.0&key=YOUR_KEY_HERE&plugin=AMap.IndoorMap,AMap.ToolBar,AMap.Scale"></script>
<script>
// ============================================================
// ⚠️  请把 YOUR_KEY_HERE 替换为你在高德控制台申请的 Web API Key
// ============================================================

const INDOOR_POI_ID = 'B000A856LJ'; // 示例：北京国贸中心 (可换成任意支持室内地图的建筑POI)
const DEFAULT_FLOOR = 1;

let map, indoorMap, currentFloor = DEFAULT_FLOOR;
let floorInfo = null;
let markers = {};
let selectedMarker = null;

// ----- 创建地图 -----
map = new AMap.Map('container', {
  zoom: 18,
  center: [116.466682, 39.923423],
  viewMode: '2D',
  mapStyle: 'amap://styles/normal',
});

// 加载插件
AMap.plugin(['AMap.ToolBar', 'AMap.Scale', 'AMap.IndoorMap', 'AMap.PlaceSearch'], function () {
  map.addControl(new AMap.Scale());
  map.addControl(new AMap.ToolBar({ position: 'right-bottom' }));

  // 创建室内地图图层
  indoorMap = new AMap.IndoorMap({ alwaysShow: true, opacity: 1 });
  map.add(indoorMap);

  // 绑定室内地图事件
  indoorMap.on('floorchanged', function (e) {
    currentFloor = e.floor;
    updateFloorUI(e.floor);
  });

  indoorMap.on('buildingchanged', function (e) {
    floorInfo = e.building;
    updateBuildingInfo(e.building);
  });

  // 显示室内地图
  indoorMap.showIndoorMap(INDOOR_POI_ID, DEFAULT_FLOOR);

  // 加载完成
  map.on('complete', function () {
    setTimeout(() => {
      document.getElementById('loading').classList.add('hide');
    }, 800);
  });
});

// ----- 更新建筑信息 -----
function updateBuildingInfo(building) {
  if (!building) return;
  document.getElementById('building-name').textContent = building.name || '未知建筑';
  document.getElementById('floor-count').textContent =
    (building.floor || '?') + ' 层';
  renderFloorButtons(building.layers || []);
}

// ----- 楼层按钮渲染 -----
function renderFloorButtons(layers) {
  const panel = document.getElementById('floor-panel');
  // 保留标题
  const title = panel.querySelector('.floor-title');
  panel.innerHTML = '';
  panel.appendChild(title);

  if (!layers || layers.length === 0) {
    // 默认楼层（无数据时）
    const defaultFloors = ['F4','F3','F2','F1','B1'];
    defaultFloors.forEach((name, i) => {
      const btn = document.createElement('button');
      btn.className = 'floor-btn' + (i === 2 ? ' active' : '');
      btn.textContent = name;
      btn.onclick = () => switchFloor(i - 2, name);
      panel.appendChild(btn);
    });
    return;
  }

  // 按楼层索引排序
  const sorted = [...layers].sort((a, b) => b.index - a.index);
  sorted.forEach((layer, i) => {
    const btn = document.createElement('button');
    btn.className = 'floor-btn' + (layer.index === DEFAULT_FLOOR ? ' active' : '');
    btn.textContent = layer.name || ('F' + layer.index);
    btn.onclick = () => switchFloor(layer.index, layer.name);
    panel.appendChild(btn);
  });
}

// ----- 切换楼层 -----
function switchFloor(floorIndex, name) {
  currentFloor = floorIndex;
  if (indoorMap) {
    indoorMap.showIndoorMap(INDOOR_POI_ID, floorIndex);
  }
  // 更新按钮样式
  document.querySelectorAll('.floor-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event && event.target && event.target.classList.add('active');
  document.getElementById('current-floor').textContent = name || ('F' + floorIndex);
  showTip('已切换至 ' + (name || '楼层 ' + floorIndex));
}

// ----- 更新楼层UI -----
function updateFloorUI(floorIndex) {
  document.getElementById('current-floor').textContent = 'F' + floorIndex;
  // 同步按钮高亮
  document.querySelectorAll('.floor-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  // 找匹配的按钮
  const btns = document.querySelectorAll('.floor-btn');
  if (btns[floorIndex]) btns[floorIndex].classList.add('active');
}

// ----- 地图点击获取坐标 -----
map.on('click', function (e) {
  const lng = e.lnglat.getLng().toFixed(6);
  const lat = e.lnglat.getLat().toFixed(6);
  document.getElementById('center-coord').textContent = lng + ', ' + lat;
  navigator.clipboard.writeText(lng + ',' + lat).then(() => {
    showTip('📋 坐标已复制: ' + lng + ', ' + lat);
  }).catch(() => {
    showTip('坐标: ' + lng + ', ' + lat);
  });
});

// ----- 提示 -----
let tipTimer;
function showTip(msg) {
  const tip = document.getElementById('tip');
  tip.textContent = msg;
  tip.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => tip.classList.remove('show'), 2500);
}

// ----- 楼层内导航提示 -----
function showRouteTip() {
  showTip('🧭 室内导航功能需配合路径规划API使用');
}

// ----- POI 搜索（楼层内搜索） -----
const poiInput = document.getElementById('poi-input');
const searchResults = document.getElementById('search-results');

// 模拟楼层内POI数据（实际项目中可调用高德室内POI搜索API）
const indoorPois = {
  1: [
    { name: '星巴克咖啡', addr: 'F1 东侧', type: '餐饮', floor: 1 },
    { name: '优衣库', addr: 'F1 西侧', type: '服装', floor: 1 },
    { name: '入口A', addr: 'F1 南门', type: '出入口', floor: 1 },
    { name: '电梯1', addr: 'F1 中央', type: '设施', floor: 1 },
    { name: '卫生间', addr: 'F1 北侧', type: '设施', floor: 1 },
    { name: '客服中心', addr: 'F1 大堂', type: '服务', floor: 1 },
  ],
  0: [
    { name: '美食广场', addr: 'B1 全层', type: '餐饮', floor: 0 },
    { name: '超市', addr: 'B1 东区', type: '零售', floor: 0 },
    { name: '入口B', addr: 'B1 地铁连接', type: '出入口', floor: 0 },
    { name: '电梯2', addr: 'B1 中央', type: '设施', floor: 0 },
    { name: '停车场入口', addr: 'B1 西侧', type: '停车场', floor: 0 },
  ],
  2: [
    { name: '耐克旗舰店', addr: 'F2 东侧', type: '服装', floor: 2 },
    { name: '苹果体验店', addr: 'F2 西侧', type: '数码', floor: 2 },
    { name: '扶梯A', addr: 'F2 中央', type: '设施', floor: 2 },
    { name: '电梯1', addr: 'F2 中央', type: '设施', floor: 2 },
  ],
  3: [
    { name: '电影院', addr: 'F3 全层', type: '娱乐', floor: 3 },
    { name: '儿童游乐区', addr: 'F3 东区', type: '娱乐', floor: 3 },
  ],
};

poiInput.addEventListener('input', function () {
  const q = this.value.trim();
  if (!q) { searchResults.classList.remove('show'); return; }
  const currentFloorPois = indoorPois[currentFloor] || [];
  const allPois = Object.values(indoorPois).flat();
  const results = allPois.filter(p =>
    p.name.includes(q) || p.type.includes(q) || p.addr.includes(q)
  );
  if (results.length === 0) {
    searchResults.innerHTML = '<div class="search-item" style="color:#999">未找到相关结果</div>';
  } else {
    searchResults.innerHTML = results.map(p =>
      `<div class="search-item" onclick="selectPOI('${p.name}', '${p.addr}', ${p.floor})">
        <div class="s-name">${highlight(q, p.name)}</div>
        <div class="s-addr">${p.addr} · ${p.type} · ${p.floor === currentFloor ? '当前楼层' : 'F' + p.floor}</div>
      </div>`
    ).join('');
  }
  searchResults.classList.add('show');
});

function highlight(key, text) {
  return text.replace(key, '<b style="color:#3b82f6">' + key + '</b>');
}

function selectPOI(name, addr, floor) {
  poiInput.value = name;
  searchResults.classList.remove('show');
  if (floor !== currentFloor) {
    // 切换到对应楼层
    const btns = document.querySelectorAll('.floor-btn');
    if (btns[floor]) btns[floor].click();
  }
  showTip('📍 已定位: ' + name + ' - ' + addr);
}

document.addEventListener('click', function (e) {
  if (!poiInput.contains(e.target) && !searchResults.contains(e.target)) {
    searchResults.classList.remove('show');
  }
});

// 初始显示
showTip('🗺️ 室内地图加载完成，点击右侧楼层按钮切换');
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>室内地图 · 高速版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }

    .btn { border: none; border-radius: 8px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .btn-p { background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; font-weight: 600; }
    .btn-p:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(59,130,246,0.4); }
    .btn-p:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-g { background: rgba(255,255,255,0.9); color: #333; font-weight: 500; border: 1.5px solid #e5e7eb; }
    .btn-g:hover { background: #f0f4ff; border-color: #3b82f6; color: #3b82f6; }

    #container { width: 100vw; height: 100vh; }

    /* ==== 顶部栏 ==== */
    #header {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      background: rgba(6, 12, 40, 0.93);
      backdrop-filter: blur(16px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 999;
      box-shadow: 0 2px 20px rgba(0,0,0,0.35);
      gap: 10px;
    }
    .logo { font-size: 16px; font-weight: 700; color: #fff; white-space: nowrap; }
    .logo span { color: #00d4ff; }
    .hdr-center { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; }
    .hdr-sel {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
      color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px;
      font-family: inherit; outline: none; cursor: pointer;
    }
    .hdr-sel option { background: #0f1f3d; }
    .badge {
      font-size: 11px; padding: 3px 10px; border-radius: 12px; white-space: nowrap;
      background: rgba(0,212,255,0.12); color: #00d4ff; border: 1px solid rgba(0,212,255,0.25);
    }
    .badge.ok { background: rgba(16,185,129,0.15); color: #6ee7b7; border-color: rgba(16,185,129,0.3); }
    .badge.loading { background: rgba(99,102,241,0.15); color: #a5b4fc; border-color: rgba(99,102,241,0.3); }
    .badge.cache { background: rgba(245,158,11,0.15); color: #fcd34d; border-color: rgba(245,158,11,0.3); }
    .badge.warn { background: rgba(239,68,68,0.15); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
    .badge.nav { background: rgba(16,185,129,0.15); color: #10b981; border-color: rgba(16,185,129,0.3); }

    /* ==== 加载遮罩 ==== */
    #loading {
      position: fixed; inset: 0; background: #060d24;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 2000; transition: opacity 0.6s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .lr { width: 52px; height: 52px; border: 3px solid rgba(0,212,255,0.12); border-top-color: #00d4ff; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lt { color: rgba(255,255,255,0.65); font-size: 14px; }
    .ls { color: rgba(255,255,255,0.3); font-size: 12px; margin-top: 6px; }
    .progress-wrap { width: 200px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 14px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #00d4ff, #6366f1); border-radius: 2px; transition: width 0.25s; width: 0%; }

    /* ==== 左侧面板 ==== */
    #panel {
      position: fixed; top: 72px; left: 14px; width: 248px;
      background: rgba(255,255,255,0.97); border-radius: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12); z-index: 999;
      backdrop-filter: blur(12px); display: flex; flex-direction: column; overflow: hidden;
      max-height: calc(100vh - 100px);
    }
    .ph {
      background: linear-gradient(135deg, #3b82f6, #6366f1); padding: 11px 14px; color: #fff;
    }
    .ph .n { font-size: 14px; font-weight: 700; }
    .ph .a { font-size: 11px; opacity: 0.75; margin-top: 2px; }
    .pb { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

    /* 统计行 */
    .stat-row { display: flex; border-bottom: 1px solid #f0f0f0; }
    .si { flex: 1; padding: 7px 10px; text-align: center; border-right: 1px solid #f0f0f0; }
    .si:last-child { border-right: none; }
    .sn { font-size: 18px; font-weight: 800; color: #3b82f6; }
    .sl { font-size: 10px; color: #999; margin-top: 1px; }

    /* 缓存状态 */
    .cache-bar { padding: 6px 14px; font-size: 11px; color: #888; border-bottom: 1px solid #f0f0f0; background: #fafafa; display: flex; align-items: center; gap: 6px; }
    .cache-dot { width: 7px; height: 7px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; }
    .cache-dot.live { background: #3b82f6; animation: pulse 1.5s infinite; }
    .cache-dot.cached { background: #f59e0b; }
    .cache-dot.none { background: #d1d5db; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* 分类标签 */
    .cat-row { display: flex; gap: 4px; padding: 7px 10px; overflow-x: auto; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; }
    .cat-row::-webkit-scrollbar { height: 2px; }
    .cat-row::-webkit-scrollbar-thumb { background: #d1d5db; }
    .cat-btn { padding: 3px 9px; border-radius: 20px; border: 1px solid #e5e7eb; background: #fff; font-size: 11px; color: #666; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.15s; }
    .cat-btn:hover { background: #f0f4ff; border-color: #3b82f6; color: #3b82f6; }
    .cat-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }

    /* 加载骨架屏 */
    .skeleton-wrap { padding: 8px 14px; }
    .skel { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; margin-bottom: 6px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skel-h { height: 13px; }
    .skel-line { height: 10px; }

    /* POI 列表 */
    #poi-list { flex: 1; overflow-y: auto; }
    .poi-cat { padding: 5px 14px 3px; font-size: 10px; color: #bbb; letter-spacing: 0.5px; text-transform: uppercase; background: #fafafa; border-top: 1px solid #f0f0f0; }
    .poi-item { display: flex; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer; transition: background 0.12s; border-bottom: 1px solid rgba(0,0,0,0.03); }
    .poi-item:hover { background: #f5f7ff; }
    .poi-item.sel { background: #eef2ff; border-left: 3px solid #3b82f6; padding-left: 11px; }
    .poi-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .poi-info { flex: 1; min-width: 0; }
    .poi-name { font-size: 13px; font-weight: 600; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .poi-meta { font-size: 11px; color: #999; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 面板底部 */
    .panel-foot { padding: 7px 14px; border-top: 1px solid #f0f0f0; background: #fafafa; font-size: 11px; color: #aaa; display: flex; justify-content: space-between; align-items: center; }

    /* ==== 导航面板 ==== */
    #nav-panel {
      position: fixed; top: 72px; left: 14px; width: 248px;
      background: rgba(255,255,255,0.98); border-radius: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15); z-index: 999;
      backdrop-filter: blur(12px); display: none; overflow: hidden;
    }
    #nav-panel.show { display: block; }
    .nh { background: linear-gradient(135deg, #10b981, #059669); padding: 11px 14px; color: #fff; }
    .nh .t { font-size: 14px; font-weight: 700; }
    .nh .d { font-size: 11px; opacity: 0.8; margin-top: 2px; }
    .nb { padding: 10px 12px; max-height: 340px; overflow-y: auto; }
    .dist-box { text-align: center; padding: 8px; background: #f8faff; border-radius: 10px; margin-bottom: 8px; }
    .dist-n { font-size: 24px; font-weight: 900; color: #3b82f6; }
    .dist-u { font-size: 12px; color: #888; }
    .dist-l { font-size: 11px; color: #bbb; }
    .n-step { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #f0f0f0; }
    .n-step:last-child { border-bottom: none; }
    .si2 { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-top: 1px; }
    .st { font-size: 12px; color: #333; line-height: 1.5; }

    /* ==== 右侧楼层 ==== */
    #floor-panel {
      position: fixed; top: 50%; right: 14px; transform: translateY(-50%);
      background: rgba(255,255,255,0.97); border-radius: 12px;
      padding: 8px 7px; box-shadow: 0 6px 28px rgba(0,0,0,0.12);
      z-index: 999; display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .ft-t { font-size: 9px; color: #ccc; letter-spacing: 1px; margin-bottom: 3px; text-transform: uppercase; }
    .ft-btn { width: 40px; height: 30px; border: none; border-radius: 6px; background: transparent; color: #555; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.18s; font-family: inherit; }
    .ft-btn:hover { background: #eef2ff; color: #3b82f6; }
    .ft-btn.active { background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; box-shadow: 0 2px 8px rgba(59,130,246,0.4); }
    .ft-sep { width: 24px; height: 1px; background: #eee; margin: 1px 0; }

    /* ==== 底部栏 ==== */
    #bottom-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.97); border-radius: 28px;
      padding: 7px 10px; display: flex; gap: 6px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.12); z-index: 999;
      backdrop-filter: blur(12px);
    }
    .bar-btn { padding: 8px 16px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; }

    /* ==== 提示 ==== */
    #tip { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #fff; border-radius: 22px; padding: 8px 20px; font-size: 13px; z-index: 1000; pointer-events: none; opacity: 0; transition: opacity 0.35s; backdrop-filter: blur(8px); white-space: nowrap; }
    #tip.show { opacity: 1; }

    /* ==== 图例 ==== */
    #legend { position: fixed; bottom: 24px; left: 14px; background: rgba(255,255,255,0.96); border-radius: 12px; padding: 10px 14px; font-size: 12px; color: #555; z-index: 999; box-shadow: 0 2px 12px rgba(0,0,0,0.08); backdrop-filter: blur(8px); }
    #legend h4 { font-size: 10px; color: #bbb; margin-bottom: 6px; text-transform: uppercase; }
    .li { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    .ld { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
  </style>
</head>
<body>

<div id="loading">
  <div class="lr"></div>
  <div class="lt">室内地图 · 高速加载中</div>
  <div class="ls" id="load-sub">初始化地图…</div>
  <div class="progress-wrap"><div class="progress-bar" id="prog-bar"></div></div>
</div>

<div id="container"></div>

<!-- 顶部栏 -->
<div id="header">
  <div class="logo">🗺️ <span>室内地图</span></div>
  <div class="hdr-center">
    <select class="hdr-sel" id="b-sel">
      <option value="0">北京国贸中心</option>
      <option value="1">上海IFC</option>
      <option value="2">深圳万象城</option>
      <option value="3">广州太古汇</option>
    </select>
    <span class="badge" id="mode-badge">⏳ 初始化</span>
  </div>
</div>

<!-- 左侧主面板 -->
<div id="panel">
  <div class="ph">
    <div class="n" id="b-name">—</div>
    <div class="a" id="b-addr">—</div>
  </div>
  <div class="pb">
    <div class="stat-row">
      <div class="si"><div class="sn" id="s-total">0</div><div class="sl">POI 总数</div></div>
      <div class="si"><div class="sn" id="s-loaded">0</div><div class="sl">已显示</div></div>
      <div class="si"><div class="sn" id="s-show">0</div><div class="sl">筛选中</div></div>
    </div>
    <div class="cache-bar" id="cache-bar">
      <div class="cache-dot none" id="cache-dot"></div>
      <span id="cache-text">等待加载…</span>
    </div>
    <div class="cat-row" id="cat-row"></div>
    <div id="poi-list">
      <!-- 骨架屏 or POI列表 -->
    </div>
    <div class="panel-foot">
      <span id="foot-info">—</span>
    </div>
  </div>
</div>

<!-- 导航面板 -->
<div id="nav-panel">
  <div class="nh">
    <div class="t">🧭 室内导航</div>
    <div class="d" id="nav-dest">→ </div>
  </div>
  <div class="nb">
    <div class="dist-box">
      <span class="dist-n" id="dist-n">0</span><span class="dist-u">米</span>
      <div class="dist-l">约步行距离</div>
    </div>
    <div id="nav-steps"></div>
  </div>
</div>

<!-- 右侧楼层 -->
<div id="floor-panel">
  <div class="ft-t">楼层</div>
</div>

<!-- 底部栏 -->
<div id="bottom-bar">
  <button class="btn btn-g bar-btn" onclick="clearAll()" style="padding:8px 14px">🗑️ 清除</button>
  <button class="btn btn-p bar-btn" id="nav-btn" onclick="doNav()">🧭 导航</button>
</div>

<!-- 提示 -->
<div id="tip"></div>

<!-- 图例 -->
<div id="legend">
  <h4>📌 图例</h4>
  <div class="li"><div class="ld" style="background:#3b82f6"></div> 餐饮</div>
  <div class="li"><div class="ld" style="background:#8b5cf6"></div> 购物</div>
  <div class="li"><div class="ld" style="background:#10b981"></div> 运动</div>
  <div class="li"><div class="ld" style="background:#06b6d4"></div> 导航路径</div>
  <div class="li"><div class="ld" style="background:#ef4444"></div> 导航终点</div>
</div>

<!-- 高德地图 -->
<script src="https://webapi.amap.com/maps?v=2.0&key=YOUR_AMAP_KEY_HERE&plugin=AMap.IndoorMap,AMap.ToolBar,AMap.Scale,AMap.PlaceSearch"></script>
<script>
// ================================================================
// ⚠️  请把 YOUR_KEY_HERE 替换为你的高德 Web API Key
// ================================================================

// ================================================================
// 🚀 性能优化策略
// ================================================================
// 1. localStorage 缓存：同一建筑第二次访问秒开（0ms等待）
// 2. 骨架屏先显示：UI立刻呈现，不卡顿
// 3. 分批渲染：POI每10个一批，逐步显示，不白屏
// 4. 后台静默刷新：缓存数据展示同时，异步刷新最新数据
// 5. 缓存过期时间：24小时，超时才重新请求
// ================================================================

const BUILDINGS = [
  { id:0, name:'北京国贸中心', addr:'北京市朝阳区建国门外大街1号', poiId:'B000A856LJ', queryName:'国贸中心', city:'北京', center:[116.466682,39.923423], floors:['F4','F3','F2','F1','B1'], floorIdx:[3,2,1,0,-1], defaultIdx:3 },
  { id:1, name:'上海IFC', addr:'上海市浦东新区世纪大道88号', poiId:'B000A857LB', queryName:'IFC国际金融中心', city:'上海', center:[121.514680,31.236180], floors:['F4','F3','F2','F1','B1'], floorIdx:[3,2,1,0,-1], defaultIdx:3 },
  { id:2, name:'深圳万象城', addr:'深圳市罗湖区宝安南路1881号', poiId:'B000A859LD', queryName:'万象城', city:'深圳', center:[114.128370,22.549820], floors:['F5','F4','F3','F2','F1','B1'], floorIdx:[4,3,2,1,0,-1], defaultIdx:4 },
  { id:3, name:'广州太古汇', addr:'广州市天河区天河路383号', poiId:'B000A860LE', queryName:'太古汇', city:'广州', center:[113.331880,23.136740], floors:['F4','F3','F2','F1','B1'], floorIdx:[3,2,1,0,-1], defaultIdx:3 },
];

// ================================================================
// 全局状态
// ================================================================
let map, indoorMap;
let currentBIdx = 0;
let currentFloorIdx = 3;
let selectedPOI = null;
let isNavMode = false;
let navDest = null;

// POI
let allPOIs = [];
let filteredPOIs = [];

// 标记
let poiMarkers = [];
let startMarker = null, endMarker = null;
let navPolyline = null;
let animTimer = null;

// 缓存
const CACHE_TTL = 24 * 60 * 60 * 1000; // 24小时
let cacheMode = 'none'; // none | cached | live | stale
let batchTimer = null;

// ================================================================
// 缓存读写
// ================================================================
function getCache(bIdx) {
  try {
    const raw = localStorage.getItem('indoormap_cache_' + bIdx);
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (Date.now() - c.ts > CACHE_TTL) return null;
    return c.data;
  } catch { return null; }
}

function setCache(bIdx, pois) {
  try {
    localStorage.setItem('indoormap_cache_' + bIdx, JSON.stringify({
      ts: Date.now(),
      data: pois,
    }));
  } catch {}
}

// ================================================================
// 地图初始化
// ================================================================
setProgress(10, '连接高德服务器…');

map = new AMap.Map('container', {
  zoom: 19,
  center: BUILDINGS[0].center,
  viewMode: '2D',
  mapStyle: 'amap://styles/normal',
});

AMap.plugin(['AMap.ToolBar', 'AMap.Scale', 'AMap.IndoorMap', 'AMap.PlaceSearch'], function () {
  setProgress(30, '加载插件…');
  map.addControl(new AMap.Scale());
  map.addControl(new AMap.ToolBar({ position: 'right-bottom' }));

  indoorMap = new AMap.IndoorMap({ alwaysShow: true, opacity: 1 });
  map.add(indoorMap);

  indoorMap.on('floorchanged', onFloorChanged);
  indoorMap.on('buildingchanged', onBuildingChanged);
  map.on('click', onMapClick);
  map.on('complete', () => {
    setProgress(50, '地图就绪…');
    renderFloorBtns();
    loadBuilding(0);
    setTimeout(() => {
      document.getElementById('loading').classList.add('hide');
      setBadge('✅ 就绪', 'ok');
    }, 400);
  });
});

// ================================================================
// 加载建筑：优先缓存 → 立即显示 → 后台刷新
// ================================================================
function loadBuilding(idx) {
  currentBIdx = idx;
  const b = BUILDINGS[idx];

  // 重置状态
  clearMarkers();
  hideNavPanel();
  isNavMode = false;
  navDest = null;
  selectedPOI = null;
  if (batchTimer) clearInterval(batchTimer);

  // UI更新
  document.getElementById('b-name').textContent = b.name;
  document.getElementById('b-addr').textContent = b.addr;
  document.getElementById('s-total').textContent = '0';
  document.getElementById('s-loaded').textContent = '0';
  document.getElementById('s-show').textContent = '0';
  document.getElementById('foot-info').textContent = '—';
  document.getElementById('poi-list').innerHTML = '';
  document.getElementById('cat-row').innerHTML = '';

  // 加载室内图
  indoorMap.showIndoorMap(b.poiId, b.floorIdx[b.defaultIdx]);
  currentFloorIdx = b.floorIdx[b.defaultIdx];
  map.setCenter(b.center);
  map.setZoom(19);
  renderFloorBtns();

  // ===== 核心：检查缓存 =====
  const cached = getCache(idx);

  if (cached && cached.length > 0) {
    // ✅ 命中缓存 → 秒开！
    cacheMode = 'cached';
    setCacheUI('cached', `📦 缓存数据 (${cached.length}条) 点击切换建筑立即可用`);
    setBadge('⚡ 秒开', 'cache');
    log(`✅ 缓存命中: ${cached.length} 条，0ms延迟`);
    allPOIs = cached;
    onPOILoaded();
  } else {
    // ❌ 无缓存 → 骨架屏 + API请求
    cacheMode = 'none';
    setCacheUI('none', '🔄 首次加载，请求API…');
    setBadge('⏳ 加载中', 'loading');
    showSkeleton();
    log('📡 无缓存，开始API请求…');
    requestPOI(b);
  }
}

// ================================================================
// API 请求（仅无缓存时调用）
// ================================================================
function requestPOI(building) {
  const ps = new AMap.PlaceSearch({
    type: '餐饮服务|购物服务|生活服务|体育休闲服务|医疗保健服务|住宿服务',
    city: building.city,
    citylimit: true,
    pageSize: 50,
    pageIndex: 1,
  });

  setProgress(60, '查询POI数据…');
  setCacheUI('live', '🔄 实时查询中…');
  setBadge('🔄 查询API', 'loading');
  log('📡 PlaceSearch.searchNearBy: ' + building.queryName + ' 200m');

  ps.searchNearBy(building.queryName, building.center, 200, function (status, result) {
    setProgress(80, '解析数据…');

    if (status === 'complete' && result.poiList && result.poiList.pois) {
      const pois = result.poiList.pois;
      const parsed = pois
        .filter(p => p.location)
        .map(p => ({
          name: p.name,
          lng: parseFloat(p.location.lng),
          lat: parseFloat(p.location.lat),
          type: getType(p.type || ''),
          icon: getIcon(p.type || ''),
          color: getColor(p.type || ''),
          address: p.address || '',
          distance: p.distance || 0,
        }))
        .sort((a, b) => (a.distance || 999) - (b.distance || 999));

      // 存入缓存
      setCache(building.id, parsed);
      cacheMode = 'live';
      allPOIs = parsed;

      log(`✅ API成功: ${parsed.length} 条 POI`);
      setProgress(100, '加载完成');
      onPOILoaded();
    } else {
      log(`❌ API失败: ${status}`);
      setBadge('⚠️ 无数据', 'warn');
      setCacheUI('none', '⚠️ 无POI数据，请刷新重试');
      document.getElementById('poi-list').innerHTML =
        '<div style="text-align:center;padding:24px;color:#f59e0b;font-size:13px">⚠️ 高德暂无该建筑POI<br><span style="font-size:11px;color:#ccc">尝试切换其他建筑</span></div>';
    }
  });
}

// ================================================================
// POI加载完成：分类 + 分批渲染
// ================================================================
function onPOILoaded() {
  const total = allPOIs.length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('foot-info').textContent = cacheMode === 'cached' ? '📦 来自缓存' : '🌐 实时数据';

  if (cacheMode === 'cached') setBadge('⚡ 缓存', 'cache');
  else setBadge('✅ 已加载', 'ok');

  // 分类
  renderCategories();

  // 默认全显示
  filteredPOIs = allPOIs;
  document.getElementById('s-show').textContent = total;

  // 分批渲染（每批10条，间隔50ms，不卡UI）
  batchRender();
}

// ================================================================
// 🏎️ 分批渲染：每批10条，50ms间隔，UI永远流畅
// ================================================================
function batchRender() {
  if (batchTimer) clearInterval(batchTimer);
  poiMarkers.forEach(m => m.setMap(null));
  poiMarkers = [];

  const BATCH = 10;
  const DELAY = 40; // ms
  let rendered = 0;
  let listHtml = '';

  // 先清空列表，显示骨架屏
  const listEl = document.getElementById('poi-list');
  listEl.innerHTML = buildSkeletonHtml(20);

  // 按类型分组
  const groups = {};
  filteredPOIs.forEach(p => {
    if (!groups[p.type]) groups[p.type] = [];
    groups[p.type].push(p);
  });

  // 构建完整HTML
  const cats = Object.keys(groups).sort();
  cats.forEach(cat => {
    listHtml += `<div class="poi-cat">${cat}</div>`;
    groups[cat].forEach((poi, gi) => {
      const globalIdx = filteredPOIs.indexOf(poi);
      listHtml += buildPoiItemHtml(poi, globalIdx);
    });
  });

  // 分批插入
  const steps = Math.ceil(filteredPOIs.length / BATCH);
  let step = 0;

  batchTimer = setInterval(() => {
    step++;
    const slice = Math.min(step * BATCH, filteredPOIs.length);
    rendered = slice;

    // 更新列表（用增量方式）
    const partialGroups = {};
    filteredPOIs.slice(0, slice).forEach(p => {
      if (!partialGroups[p.type]) partialGroups[p.type] = [];
      partialGroups[p.type].push(p);
    });

    let partialHtml = '';
    Object.keys(partialGroups).sort().forEach(cat => {
      partialHtml += `<div class="poi-cat">${cat}</div>`;
      partialGroups[cat].forEach((poi, gi) => {
        const globalIdx = filteredPOIs.indexOf(poi);
        partialHtml += buildPoiItemHtml(poi, globalIdx);
      });
    });
    listEl.innerHTML = partialHtml;
    document.getElementById('s-loaded').textContent = slice;

    if (step >= steps) {
      clearInterval(batchTimer);
      batchTimer = null;
      log(`✅ 分批渲染完成: ${slice} 条 POI`);
    }
  }, DELAY);

  // 同时分批渲染地图标记
  let markerStep = 0;
  const markerTimer = setInterval(() => {
    markerStep++;
    const end = Math.min(markerStep * BATCH, filteredPOIs.length);
    for (let i = (markerStep - 1) * BATCH; i < end; i++) {
      const poi = filteredPOIs[i];
      const m = new AMap.Marker({
        position: [poi.lng, poi.lat],
        content: buildMarkerHtml(poi, false),
        offset: new AMap.Pixel(-14, -14),
        extData: { idx: i },
      });
      const iw = new AMap.InfoWindow({
        content: buildInfoWindow(poi, i),
        offset: new AMap.Pixel(0, -28),
        closeWhenClickMap: true,
      });
      m.on('click', () => { selectPOI(i); iw.open(map, m.getPosition()); });
      m.setMap(map);
      poiMarkers.push(m);
    }
    if (markerStep >= Math.ceil(filteredPOIs.length / BATCH)) {
      clearInterval(markerTimer);
    }
  }, DELAY);
}

// ================================================================
// 分类筛选（客户端过滤，无需重新请求）
// ================================================================
let activeCat = '全部';

function renderCategories() {
  const cats = [...new Set(allPOIs.map(p => p.type))].sort();
  const wrap = document.getElementById('cat-row');
  let html = `<button class="cat-btn active" onclick="filterByCat('全部')">全部</button>`;
  cats.forEach(c => {
    html += `<button class="cat-btn" onclick="filterByCat('${c}')">${c}</button>`;
  });
  wrap.innerHTML = html;
}

function filterByCat(cat) {
  activeCat = cat;
  filteredPOIs = cat === '全部' ? allPOIs : allPOIs.filter(p => p.type === cat);
  document.getElementById('s-show').textContent = filteredPOIs.length;

  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === cat);
  });

  // 快速渲染（立即清空 + 分批）
  poiMarkers.forEach(m => m.setMap(null));
  poiMarkers = [];
  document.getElementById('s-loaded').textContent = '0';
  batchRender();
  log(`筛选 ${cat}: ${filteredPOIs.length} 条`);
}

// ================================================================
// 选中POI
// ================================================================
function selectPOI(idx) {
  const poi = filteredPOIs[idx];
  if (!poi) return;
  selectedPOI = poi;
  map.setCenter([poi.lng, poi.lat]);

  // 高亮标记
  poiMarkers.forEach((m, i) => {
    const p = filteredPOIs[i];
    const isSel = p === poi;
    m.setContent(buildMarkerHtml(p, isSel));
    m.setOffset(isSel ? new AMap.Pixel(-17, -17) : new AMap.Pixel(-14, -14));
  });

  // 高亮列表
  document.querySelectorAll('.poi-item').forEach((el, i) => {
    el.classList.toggle('sel', i === idx);
  });

  log(`选中: ${poi.name} (${poi.lng.toFixed(5)}, ${poi.lat.toFixed(5)})`);
  showTip(`✅ ${poi.name}（点击「导航」开始路线）`);
}

// ================================================================
// 导航
// ================================================================
function doNav() {
  if (!selectedPOI) { showTip('⚠️ 请先在列表点击选择一个目标'); return; }
  startNav(selectedPOI);
}

function startNav(target) {
  navDest = target;
  isNavMode = true;
  setBadge('🧭 导航中', 'nav');

  [startMarker, endMarker, navPolyline].forEach(m => { if (m) m.setMap(null); });
  const b = BUILDINGS[currentBIdx];

  startMarker = new AMap.Marker({
    position: b.center,
    content: `<div style="background:#10b981;color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(16,185,129,0.5);border:2px solid #fff">🚩</div>`,
    offset: new AMap.Pixel(-15,-15),
  }).setMap(map);

  endMarker = new AMap.Marker({
    position: [target.lng, target.lat],
    content: `<div style="background:#ef4444;color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(239,68,68,0.5);border:2px solid #fff">🏁</div>`,
    offset: new AMap.Pixel(-15,-15),
  }).setMap(map);

  // 路径
  if (navPolyline) navPolyline.setMap(null);
  if (animTimer) clearInterval(animTimer);

  const s = b.center, e = [target.lng, target.lat];
  const mid = [(s[0]+e[0])/2 + (Math.random()-0.5)*0.0001, (s[1]+e[1])/2 + (Math.random()-0.5)*0.0001];
  const dist = calcDist(s[0],s[1],e[0],e[1]);

  navPolyline = new AMap.Polyline({
    path:[s,mid,e], strokeColor:'#06b6d4', strokeOpacity:0.9,
    strokeWeight:5, strokeStyle:'solid',
    borderWeight:3, borderColor:'rgba(255,255,255,0.7)',
  }).setMap(map);

  let offset = 0;
  animTimer = setInterval(() => {
    offset = (offset+1)%20;
    if (navPolyline) navPolyline.setOptions({ strokeDasharray:[offset,20-offset] });
  }, 80);

  document.getElementById('dist-n').textContent = Math.round(dist);
  document.getElementById('nav-dest').textContent = '→ ' + target.name;
  document.getElementById('nav-steps').innerHTML = [
    {icon:'🚩',bg:'#d1fae5',t:'从当前位置出发'},
    {icon:'🚶',bg:'#eff6ff',t:'沿主通道步行'},
    {icon:'🏁',bg:'#fee2e2',t:'到达：'+target.name},
  ].map(s => `<div class="n-step"><div class="si2" style="background:${s.bg}">${s.icon}</div><div class="st">${s.t}</div></div>`).join('');

  document.getElementById('nav-panel').classList.add('show');
  document.getElementById('panel').style.display = 'none';
  map.setCenter([target.lng, target.lat]);
  showTip('🧭 导航已规划！点击地图可更换终点');
}

// ================================================================
// 地图点击
// ================================================================
function onMapClick(e) {
  const lng = e.lnglat.getLng(), lat = e.lnglat.getLat();
  if (isNavMode && navDest) {
    const d = { name:'自定义终点', lng, lat, type:'自定义', icon:'📍', color:'#ef4444' };
    startNav(d);
    showTip('🏁 已更换终点');
  } else {
    navigator.clipboard.writeText(`${lng.toFixed(6)},${lat.toFixed(6)}`).then(() => showTip(`📋 已复制: ${lng.toFixed(6)},${lat.toFixed(6)}`));
  }
}

// ================================================================
// 清除
// ================================================================
function clearAll() {
  if (animTimer) clearInterval(animTimer);
  if (batchTimer) clearInterval(batchTimer);
  [startMarker, endMarker, navPolyline].forEach(m => { if (m) m.setMap(null); });
  poiMarkers.forEach(m => m.setMap(null));
  startMarker = endMarker = navPolyline = null;
  poiMarkers = [];
  navDest = null;
  selectedPOI = null;
  isNavMode = false;
  map.clearInfoWindow();
  hideNavPanel();
  setBadge('✅ 已清除', 'ok');
  log('清除完成');
}

// ================================================================
// 楼层
// ================================================================
function renderFloorBtns() {
  const b = BUILDINGS[currentBIdx];
  const panel = document.getElementById('floor-panel');
  panel.innerHTML = '<div class="ft-t">楼层</div>';
  b.floors.forEach((name, i) => {
    if (i > 0) { const s = document.createElement('div'); s.className = 'ft-sep'; panel.appendChild(s); }
    const btn = document.createElement('button');
    btn.className = 'ft-btn' + (i === b.defaultIdx ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => {
      indoorMap.showIndoorMap(b.poiId, b.floorIdx[i]);
      currentFloorIdx = b.floorIdx[i];
      document.querySelectorAll('.ft-btn').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
    };
    panel.appendChild(btn);
  });
}

// ================================================================
// 事件
// ================================================================
function onFloorChanged(e) {
  const b = BUILDINGS[currentBIdx];
  const fi = b.floorIdx.indexOf(e.floor);
  const name = fi >= 0 ? b.floors[fi] : 'F' + e.floor;
  document.querySelectorAll('.ft-btn').forEach(btn => {
    btn.classList.toggle('active', b.floors[b.floorIdx.indexOf(e.floor)] === btn.textContent);
  });
}

function onBuildingChanged(e) {
  if (e.building) document.getElementById('b-name').textContent = e.building.name || BUILDINGS[currentBIdx].name;
}

document.getElementById('b-sel').onchange = function() {
  loadBuilding(parseInt(this.value));
};

// ================================================================
// UI 工具
// ================================================================
function buildSkeletonHtml(n) {
  let h = '';
  for (let i = 0; i < n; i++) {
    const w = 60 + Math.random() * 30;
    const w2 = 40 + Math.random() * 40;
    h += `<div style="display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid rgba(0,0,0,0.04)">
      <div class="skel" style="width:28px;height:28px;border-radius:8px;flex-shrink:0"></div>
      <div style="flex:1">
        <div class="skel skel-h" style="width:${w}%"></div>
        <div class="skel skel-line skel-h" style="width:${w2}%;margin-top:4px"></div>
      </div>
    </div>`;
  }
  return h;
}

function buildPoiItemHtml(poi, idx) {
  return `<div class="poi-item" onclick="selectPOI(${idx})">
    <div class="poi-icon" style="background:${poi.color}22;color:${poi.color}">${poi.icon}</div>
    <div class="poi-info">
      <div class="poi-name">${poi.name}</div>
      <div class="poi-meta">${poi.type}${poi.address ? ' · ' + poi.address.slice(0,8) : ''}</div>
    </div>
  </div>`;
}

function buildMarkerHtml(poi, sel) {
  const s = sel ? 36 : 28, off = sel ? -18 : -14;
  return `<div style="background:#fff;border-radius:50%;width:${s}px;height:${s}px;display:flex;align-items:center;justify-content:center;font-size:${sel?17:14}px;box-shadow:0 2px 8px rgba(0,0,0,${sel?0.3:0.2});border:2.5px solid ${poi.color};cursor:pointer">${poi.icon}</div>`;
}

function buildInfoWindow(poi, idx) {
  return `<div style="padding:10px 12px;min-width:160px">
    <b style="font-size:14px">${poi.icon} ${poi.name}</b><br>
    <span style="color:#888;font-size:12px">${poi.type}</span>
    ${poi.address ? `<br><span style="color:#aaa;font-size:11px">${poi.address.slice(0,20)}</span>` : ''}
    <div style="margin-top:6px;font-size:11px;color:#666;font-family:monospace">📍 ${poi.lng.toFixed(5)}, ${poi.lat.toFixed(5)}</div>
    <div style="margin-top:8px;display:flex;gap:4px">
      <button onclick="selectPOI(${idx});map.clearInfoWindow();" style="flex:1;background:#3b82f6;color:#fff;border:none;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px">🧭 去这里</button>
      <button onclick="navigator.clipboard.writeText('${poi.lng.toFixed(6)},${poi.lat.toFixed(6)}')" style="flex:1;background:#f0f4ff;color:#3b82f6;border:none;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px">📋 复制</button>
    </div>
  </div>`;
}

function showSkeleton() {
  document.getElementById('poi-list').innerHTML = buildSkeletonHtml(15);
}

function setCacheUI(mode, text) {
  const dot = document.getElementById('cache-dot');
  const txt = document.getElementById('cache-text');
  dot.className = 'cache-dot ' + mode;
  if (mode === 'live') dot.classList.add('live');
  txt.textContent = text;
}

function setBadge(text, cls) {
  const b = document.getElementById('mode-badge');
  b.textContent = text;
  b.className = 'badge ' + (cls || '');
}

function setProgress(pct, text) {
  document.getElementById('prog-bar').style.width = pct + '%';
  if (text) document.getElementById('load-sub').textContent = text;
}

function hideNavPanel() {
  document.getElementById('nav-panel').classList.remove('show');
  document.getElementById('panel').style.display = 'block';
}

function clearMarkers() {
  poiMarkers.forEach(m => m.setMap(null));
  poiMarkers = [];
  [startMarker, endMarker, navPolyline].forEach(m => { if (m) m.setMap(null); });
  startMarker = endMarker = navPolyline = null;
}

// ================================================================
// 类型工具
// ================================================================
function getType(t) {
  if (/餐饮|火锅|咖啡|快餐/.test(t)) return '餐饮';
  if (/购物|服装|超市|便利/.test(t)) return '购物';
  if (/体育|健身|瑜伽/.test(t)) return '运动';
  if (/医疗|医院|药店/.test(t)) return '医疗';
  if (/住宿|酒店/.test(t)) return '住宿';
  if (/金融|银行/.test(t)) return '金融';
  if (/教育|书店/.test(t)) return '教育';
  if (/娱乐|影院|KTV/.test(t)) return '娱乐';
  return '其他';
}

function getIcon(t) {
  if (/餐饮|火锅|咖啡|快餐/.test(t)) return '🍜';
  if (/购物|服装|超市/.test(t)) return '🛍️';
  if (/体育|健身/.test(t)) return '🏃';
  if (/医疗|医院/.test(t)) return '🏥';
  if (/住宿|酒店/.test(t)) return '🏨';
  if (/金融|银行/.test(t)) return '🏦';
  if (/教育|书店/.test(t)) return '📚';
  if (/娱乐|影院/.test(t)) return '🎬';
  if (/娱乐|KTV/.test(t)) return '🎤';
  return '📍';
}

function getColor(t) {
  if (/餐饮|火锅|咖啡/.test(t)) return '#f59e0b';
  if (/购物|服装/.test(t)) return '#8b5cf6';
  if (/体育|健身/.test(t)) return '#10b981';
  if (/医疗/.test(t)) return '#ef4444';
  if (/住宿|酒店/.test(t)) return '#6366f1';
  if (/金融|银行/.test(t)) return '#3b82f6';
  if (/教育|书店/.test(t)) return '#f97316';
  if (/娱乐|影院/.test(t)) return '#ec4899';
  return '#6b7280';
}

function calcDist(lng1, lat1, lng2, lat2) {
  const dx=(lng2-lng1)*111000*Math.cos((lat1+lat2)/2*Math.PI/180);
  const dy=(lat2-lat1)*111000;
  return Math.sqrt(dx*dx+dy*dy);
}

function log(msg) {
  console.log('[IndoorMap]', msg);
}

let tipTimer;
function showTip(msg) {
  const t = document.getElementById('tip');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>室内地图 · 诊断版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
    h1 { color: #60a5fa; margin-bottom: 10px; }
    .panel { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .status { font-family: monospace; font-size: 14px; line-height: 1.8; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .warn { color: #fbbf24; }
    .info { color: #60a5fa; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-right: 10px; margin-top: 10px; }
    button:hover { background: #2563eb; }
    #map { width: 100%; height: 400px; background: #0f172a; border-radius: 8px; margin-top: 16px; display: none; }
    pre { background: #0f172a; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🗺️ 室内地图诊断工具</h1>
  
  <div class="panel">
    <h3>📋 诊断日志</h3>
    <div id="log" class="status">等待开始...</div>
  </div>

  <div class="panel">
    <h3>🎮 操作</h3>
    <button onclick="startDiagnose()">开始诊断</button>
    <button onclick="testDirectLoad()">直接加载地图</button>
    <button onclick="clearLog()">清空日志</button>
  </div>

  <div class="panel">
    <h3>🗺️ 地图区域</h3>
    <div id="map"></div>
  </div>

  <div class="panel">
    <h3>📊 网络测试</h3>
    <button onclick="testNetwork()">测试高德连通性</button>
    <div id="network-result" style="margin-top:10px;"></div>
  </div>

  <!-- 安全密钥 -->
  <script>
    window._AMapSecurityConfig = {
      securityJsCode: 'YOUR_AMAP_SECURITY_CODE'
    };
  </script>
  
  <!-- 高德 JS API -->
  <script src="https://webapi.amap.com/maps?v=2.0&key=YOUR_AMAP_KEY_HERE"></script>

  <script>
    const log = document.getElementById('log');
    const mapDiv = document.getElementById('map');
    
    function addLog(msg, type = 'info') {
      const time = new Date().toLocaleTimeString();
      const className = type === 'ok' ? 'ok' : type === 'err' ? 'err' : type === 'warn' ? 'warn' : 'info';
      log.innerHTML += `<div class="${className}">[${time}] ${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    function clearLog() {
      log.innerHTML = '';
    }

    function startDiagnose() {
      clearLog();
      addLog('🔍 开始诊断...', 'info');
      
      // 检查脚本标签
      const scripts = document.querySelectorAll('script');
      let amapScript = null;
      scripts.forEach(s => {
        if (s.src && s.src.includes('webapi.amap.com')) {
          amapScript = s;
        }
      });
      
      if (amapScript) {
        addLog(`✅ 发现高德脚本: ${amapScript.src.substring(0, 80)}...`, 'ok');
      } else {
        addLog('❌ 未找到高德脚本标签', 'err');
      }

      // 检查 securityJsCode
      if (window._AMapSecurityConfig && window._AMapSecurityConfig.securityJsCode) {
        addLog('✅ securityJsCode 已配置', 'ok');
      } else {
        addLog('⚠️ securityJsCode 未配置', 'warn');
      }

      // 检查 AMap 对象
      setTimeout(() => {
        if (typeof AMap !== 'undefined') {
          addLog('✅ AMap 对象已加载', 'ok');
          addLog(`   版本: ${AMap.v || 'unknown'}`, 'info');
          
          // 检查插件
          setTimeout(() => {
            if (AMap.IndoorMap) {
              addLog('✅ AMap.IndoorMap 插件可用', 'ok');
            } else {
              addLog('⚠️ AMap.IndoorMap 插件未加载', 'warn');
            }
            
            if (AMap.PlaceSearch) {
              addLog('✅ AMap.PlaceSearch 插件可用', 'ok');
            } else {
              addLog('⚠️ AMap.PlaceSearch 插件未加载', 'warn');
            }
          }, 2000);
        } else {
          addLog('❌ AMap 对象未加载 (typeof AMap === undefined)', 'err');
          addLog('   可能原因:', 'warn');
          addLog('   1. Key 无效或被风控', 'warn');
          addLog('   2. securityJsCode 不匹配', 'warn');
          addLog('   3. 网络无法访问 webapi.amap.com', 'warn');
          addLog('   4. 浏览器安全策略阻止 (CSP/HTTPS)', 'warn');
        }
      }, 1000);
    }

    function testDirectLoad() {
      clearLog();
      addLog('🚀 尝试直接初始化地图...', 'info');
      
      if (typeof AMap === 'undefined') {
        addLog('❌ AMap 未加载，无法初始化', 'err');
        return;
      }

      try {
        mapDiv.style.display = 'block';
        
        const map = new AMap.Map('map', {
          zoom: 17,
          center: [116.460, 39.910],
          viewMode: '3D'
        });
        
        addLog('✅ 地图初始化成功', 'ok');
        
        // 尝试加载室内地图
        AMap.plugin(['AMap.IndoorMap'], function() {
          addLog('✅ IndoorMap 插件加载回调执行', 'ok');
          
          try {
            const indoorMap = new AMap.IndoorMap({
              zIndex: 10,
              opacity: 0.7,
              visible: true
            });
            indoorMap.setMap(map);
            addLog('✅ 室内地图已添加到地图', 'ok');
            
            // 显示国贸
            indoorMap.showIndoorMap('B000A856LJ');
            addLog('✅ 尝试显示国贸中心 (B000A856LJ)', 'ok');
          } catch (e) {
            addLog(`❌ 室内地图错误: ${e.message}`, 'err');
          }
        });
        
      } catch (e) {
        addLog(`❌ 地图初始化失败: ${e.message}`, 'err');
      }
    }

    function testNetwork() {
      const result = document.getElementById('network-result');
      result.innerHTML = '测试中...';
      
      // 测试图片加载
      const img = new Image();
      const start = Date.now();
      
      img.onload = function() {
        const time = Date.now() - start;
        result.innerHTML = `<span class="ok">✅ 高德瓦片服务器可访问 (${time}ms)</span>`;
      };
      
      img.onerror = function() {
        result.innerHTML = `<span class="err">❌ 无法访问高德服务器</span>`;
      };
      
      // 高德瓦片测试
      img.src = 'https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=1&y=1&z=1&t=' + Date.now();
    }

    // 页面加载后自动开始诊断
    window.onload = function() {
      setTimeout(startDiagnose, 500);
    };
  </script>
</body>
</html>
